name: Unzip Todo3DApp

on:
  workflow_dispatch:          # run manually from the Actions tab
  push:
    paths:
      - "Todo3DApp.zip"       # or run automatically when the zip is pushed

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check it is a real zip
        run: file Todo3DApp.zip && unzip -tq Todo3DApp.zip

      - name: Unzip into the repo
        run: |
          unzip -o Todo3DApp.zip -d Todo3DApp
          rm Todo3DApp.zip

      - name: Commit extracted files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip Todo3DApp" || echo "Nothing to commit"
          git push
