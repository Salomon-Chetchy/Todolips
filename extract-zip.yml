name: Extract ZIP
on:
  workflow_dispatch:
  push:
    paths: ['**.zip']
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Todo3DApp.zip
        run: |
          ls -la *.zip || echo "No zip at root"
          for f in *.zip; do [ -f "$f" ] && unzip -o "$f" && rm "$f"; done
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: extract Todo3DApp.zip via Action" || echo "Nothing to commit"
          git push
